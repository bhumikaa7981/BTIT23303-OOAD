<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OOP but make it iconic 🧠✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#FFF9FC;
  --bg-card:#FFFFFF;
  --bg-card2:#FFFFFF;
  --pink:#F0338B;
  --cyan:#0BB4C4;
  --yellow:#F5A300;
  --lime:#4CAF3D;
  --violet:#8B5CF6;
  --ink:#2A1B4D;
  --dim:#6E6289;
  --code-bg:#211642;
  --code-text:#9AE86B;
  --accent:#0BB4C4;
}
*{box-sizing:border-box;}
html{font-size:18px;}
html,body{margin:0;padding:0;height:100%;background:var(--bg-deep);overflow:hidden;}
body{font-family:'Space Grotesk',sans-serif;color:var(--ink);}
h1,h2,h3,h4{font-family:'Baloo 2',sans-serif;margin:0;}
code, .mono{font-family:'JetBrains Mono',monospace;}
::selection{background:var(--pink);color:#fff;}

/* ---------- background ambience ---------- */
.blob{position:fixed;border-radius:50%;filter:blur(100px);opacity:.4;z-index:0;pointer-events:none;}
.blob1{width:520px;height:520px;background:var(--pink);top:-160px;left:-160px;animation:float1 14s ease-in-out infinite;}
.blob2{width:460px;height:460px;background:var(--cyan);bottom:-140px;right:-120px;animation:float2 16s ease-in-out infinite;}
.blob3{width:380px;height:380px;background:var(--violet);top:40%;left:60%;animation:float1 18s ease-in-out infinite reverse;}
.blob4{width:340px;height:340px;background:var(--yellow);bottom:10%;left:8%;opacity:.3;animation:float2 20s ease-in-out infinite reverse;}
@keyframes float1{0%,100%{transform:translate(0,0);}50%{transform:translate(60px,40px);}}
@keyframes float2{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,-30px);}}

/* ---------- top progress ---------- */
#storybar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;gap:6px;padding:14px 16px 8px;}
.seg{flex:1;height:7px;border-radius:7px;background:rgba(42,27,77,0.1);cursor:pointer;overflow:hidden;position:relative;}
.seg .fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--pink),var(--cyan));border-radius:7px;transition:width .35s ease;}
.seg.done .fill{width:100%;}
.seg.current .fill{width:100%;}

#topbar{position:fixed;top:27px;left:0;right:0;z-index:49;display:flex;justify-content:space-between;align-items:center;padding:6px 20px;pointer-events:none;}
#brand{font-family:'Baloo 2';font-weight:800;font-size:1.05rem;letter-spacing:.02em;color:var(--ink);opacity:.85;}
#counter{font-family:'JetBrains Mono';font-size:.85rem;color:var(--dim);background:rgba(42,27,77,0.06);padding:5px 12px;border-radius:20px;pointer-events:auto;}

/* ---------- side dot nav ---------- */
#dotnav{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:11px;}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(42,27,77,0.18);cursor:pointer;position:relative;transition:.25s;}
.dot:hover{background:rgba(42,27,77,0.4);}
.dot.active{background:var(--cyan);box-shadow:0 0 0 5px rgba(11,180,196,0.22);width:15px;height:15px;}
.dot .tip{position:absolute;right:24px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#fff;border:1px solid rgba(42,27,77,.12);box-shadow:0 6px 18px rgba(42,27,77,.15);color:var(--ink);padding:6px 12px;border-radius:8px;font-size:.8rem;opacity:0;pointer-events:none;transition:.2s;font-family:'Space Grotesk';}
.dot:hover .tip{opacity:1;}

/* ---------- arrows ---------- */
.navbtn{position:fixed;top:50%;transform:translateY(-50%);z-index:50;width:56px;height:56px;border-radius:50%;border:2px solid rgba(42,27,77,.15);background:rgba(255,255,255,.75);backdrop-filter:blur(6px);color:var(--ink);font-size:1.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;box-shadow:0 6px 18px rgba(42,27,77,.1);}
.navbtn:hover{background:var(--pink);border-color:var(--pink);color:#fff;transform:translateY(-50%) scale(1.08);}
.navbtn:disabled{opacity:0;pointer-events:none;}
#prevBtn{left:16px;}
#nextBtn{right:68px;}

/* ---------- deck / slides ---------- */
#deck{position:absolute;top:0;left:0;height:100%;display:flex;transition:transform .55s cubic-bezier(.65,0,.35,1);z-index:1;}
.slide{width:100vw;height:100vh;flex:none;overflow-y:auto;overflow-x:hidden;padding:0;scrollbar-width:thin;scrollbar-color:var(--pink) transparent;}
.slide::-webkit-scrollbar{width:9px;}
.slide::-webkit-scrollbar-thumb{background:var(--pink);border-radius:9px;}
.slide-inner{max-width:1360px;margin:0 auto;padding:112px 46px 100px;min-height:100%;}

/* reveal animation */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .55s ease, transform .55s ease;}
.slide.active .reveal{opacity:1;transform:translateY(0);}
.slide.active .reveal:nth-child(1){transition-delay:.05s;}
.slide.active .reveal:nth-child(2){transition-delay:.12s;}
.slide.active .reveal:nth-child(3){transition-delay:.19s;}
.slide.active .reveal:nth-child(4){transition-delay:.26s;}
.example-card.reveal{transition-delay:calc(var(--i) * 70ms + 120ms) !important;}

/* ---------- cover ---------- */
.cover-slide .slide-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:60px;}
.eyebrow-pill{display:inline-block;background:rgba(240,51,139,.1);border:1px solid rgba(240,51,139,.25);padding:11px 22px;border-radius:40px;font-size:.95rem;letter-spacing:.05em;margin-bottom:24px;font-family:'JetBrains Mono';color:#C21F72;font-weight:700;}
.cover-title{font-size:clamp(2.9rem,7.4vw,5.6rem);line-height:1.05;font-weight:800;background:linear-gradient(100deg,var(--pink),var(--cyan) 45%,var(--yellow) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.cover-sub{font-size:clamp(1.2rem,2.1vw,1.5rem);color:var(--dim);max-width:760px;margin:28px auto 8px;font-weight:500;line-height:1.55;}
.pillrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:36px;max-width:900px;}
.pill{background:var(--bg-card);border:2px solid rgba(42,27,77,.1);box-shadow:0 4px 14px rgba(42,27,77,.08);padding:11px 20px;border-radius:30px;font-size:.98rem;font-weight:700;color:var(--ink);}
.startbtn{margin-top:46px;background:linear-gradient(100deg,var(--pink),var(--violet));border:none;color:white;font-family:'Baloo 2';font-weight:700;font-size:1.3rem;padding:19px 48px;border-radius:50px;cursor:pointer;box-shadow:0 10px 30px rgba(240,51,139,.35);transition:.2s;}
.startbtn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 40px rgba(240,51,139,.5);}
.coverfoot{margin-top:58px;font-size:.92rem;color:var(--dim);opacity:.8;}

/* ---------- generic slide chrome ---------- */
.kicker{font-family:'JetBrains Mono';font-size:1rem;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;font-weight:800;margin-bottom:12px;}
.slide-title{font-size:clamp(2.4rem,4.6vw,3.8rem);font-weight:800;margin-bottom:16px;color:var(--ink);}
.slide-tagline{font-size:1.35rem;line-height:1.55;color:var(--dim);max-width:900px;margin-bottom:26px;font-weight:500;}
.definition-box{background:#fff;box-shadow:0 6px 20px rgba(42,27,77,.08);border-left:6px solid var(--accent);border-radius:12px;padding:20px 26px;margin-bottom:26px;font-size:1.15rem;line-height:1.55;color:var(--ink);max-width:960px;}
.definition-box strong{color:var(--accent);}
.syntax-block{background:var(--code-bg);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px 26px;margin-bottom:34px;max-width:980px;box-shadow:0 10px 26px rgba(42,27,77,.15);}
.syntax-block-label{font-size:.9rem;color:#B9AEDC;margin-bottom:12px;font-family:'JetBrains Mono';}
.syntax-block code{display:block;color:var(--code-text);font-size:1.08rem;padding:4px 0;}
.remember-box{margin-top:40px;background:linear-gradient(100deg,rgba(240,51,139,.1),rgba(11,180,196,.1));border:1px solid rgba(42,27,77,.1);border-radius:16px;padding:22px 28px;font-size:1.15rem;line-height:1.55;max-width:980px;color:var(--ink);}

/* ---------- quiz ---------- */
.quiz-section{margin-top:50px;}
.quiz-heading{font-size:1.6rem;color:var(--ink);margin-bottom:6px;}
.quiz-subheading{font-size:1.02rem;color:var(--dim);margin-bottom:20px;}
.quiz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:22px;}
.quiz-card{background:#fff;border:2.5px solid rgba(42,27,77,.1);border-radius:20px;padding:24px 26px 22px;box-shadow:0 8px 20px rgba(42,27,77,.07);transition:.25s;}
.quiz-card.answered{border-color:var(--accent,rgba(42,27,77,.1));}
.quiz-q{font-weight:700;font-size:1.12rem;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-options{display:flex;flex-direction:column;gap:10px;}
.quiz-opt{text-align:left;padding:12px 16px;border-radius:12px;border:2px solid rgba(42,27,77,.15);background:#fff;font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:600;color:var(--ink);cursor:pointer;transition:.18s;}
.quiz-opt:hover{border-color:var(--accent);background:rgba(11,180,196,.07);transform:translateX(3px);}
.quiz-card.answered .quiz-opt{cursor:default;pointer-events:none;}
.quiz-card.answered .quiz-opt:hover{transform:none;}
.quiz-opt.correct{background:#DFF6E3;border-color:#4CAF3D;color:#1F6B1A;}
.quiz-opt.correct::after{content:'  ✅';}
.quiz-opt.wrong{background:#FDE3ED;border-color:#F0338B;color:#A3175E;}
.quiz-opt.wrong::after{content:'  ❌';}
.quiz-explain{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .4s ease;opacity:0;}
.quiz-card.answered .quiz-explain{max-height:260px;opacity:1;}
.quiz-explain-inner{margin-top:16px;padding:14px 18px;background:linear-gradient(100deg,rgba(240,51,139,.08),rgba(11,180,196,.08));border-radius:12px;font-size:.96rem;line-height:1.55;color:var(--ink);transform:translateY(-8px);transition:transform .45s cubic-bezier(.34,1.56,.64,1) .05s;}
.quiz-card.answered .quiz-explain-inner{transform:translateY(0);}

/* ---------- practice problems ---------- */
.problem-grid{display:flex;flex-direction:column;gap:26px;margin-top:16px;}
.problem-card{background:#fff;border:2.5px solid rgba(42,27,77,.1);border-radius:22px;padding:28px 30px 30px;box-shadow:0 8px 22px rgba(42,27,77,.07);transition:.25s;}
.problem-card.revealed{border-color:var(--accent);}
.problem-head{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
.problem-num{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:1.25rem;flex:none;}
.problem-title{font-size:1.35rem;font-weight:700;color:var(--ink);}
.problem-desc{font-size:1.08rem;color:var(--dim);line-height:1.6;margin-bottom:20px;max-width:1000px;}
.problem-reveal-btn{background:linear-gradient(100deg,var(--pink),var(--violet));color:#fff;border:none;padding:13px 28px;border-radius:30px;font-family:'Baloo 2';font-weight:700;font-size:1.02rem;cursor:pointer;transition:.2s;box-shadow:0 6px 18px rgba(139,92,246,.25);}
.problem-reveal-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(240,51,139,.35);}
.problem-solution{max-height:0;overflow:hidden;transition:max-height .6s cubic-bezier(.4,0,.2,1), opacity .5s ease;opacity:0;}
.problem-card.revealed .problem-solution{max-height:3000px;opacity:1;}
.solution-diagrams{display:flex;flex-direction:column;gap:28px;padding-top:22px;margin-top:22px;border-top:2px dashed rgba(42,27,77,.15);}
.solution-block-label{font-family:'JetBrains Mono';font-size:.88rem;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
.solution-block .example-diagram{min-height:auto;padding:12px 0;}
.section-tag{position:absolute;top:22px;right:34px;font-size:.8rem;color:var(--dim);font-family:'JetBrains Mono';opacity:.6;}

/* ---------- examples grid ---------- */
.examples-grid{display:grid;grid-template-columns:1fr;gap:30px;margin-top:10px;}
.example-card{background:#fff;border:2px solid rgba(42,27,77,.08);border-radius:22px;padding:32px 34px 34px;transition:.25s;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(42,27,77,.06);}
.example-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 16px 34px rgba(42,27,77,.16);}
.example-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.example-emoji{font-size:2.2rem;}
.example-head h4{font-size:1.5rem;font-weight:700;color:var(--ink);}
.example-diagram{display:flex;align-items:center;justify-content:center;min-height:230px;padding:24px 10px;overflow-x:auto;}
.syntax-chip{background:var(--code-bg);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 16px;margin:14px 0;overflow-x:auto;}
.syntax-chip code{color:var(--code-text);font-size:1rem;white-space:nowrap;}
.example-blurb{font-size:1.08rem;color:var(--dim);line-height:1.6;margin:0;}

/* ---------- UML box ---------- */
.uml-box{background:#fff;border:3px solid var(--box-accent,var(--accent));border-radius:14px;min-width:230px;max-width:300px;box-shadow:0 8px 20px rgba(42,27,77,.12);font-size:1rem;}
.uml-box .uml-name{background:var(--box-accent,var(--accent));color:#fff;font-weight:800;text-align:center;padding:14px 18px;font-size:1.25rem;border-radius:11px 11px 0 0;font-family:'Baloo 2';}
.uml-box.abstract .uml-name{font-style:italic;}
.uml-box .uml-stereo{text-align:center;font-size:.85rem;letter-spacing:.05em;padding-top:9px;color:#B8790A;font-weight:700;font-family:'JetBrains Mono';}
.uml-box .uml-section{padding:13px 18px;border-top:2px solid rgba(42,27,77,.1);color:var(--ink);min-height:20px;}
.uml-box .uml-section div{padding:3px 0;font-family:'JetBrains Mono';font-size:.95rem;}
.uml-box .dim{opacity:.4;}
.uml-box.object-box .uml-name{text-decoration:underline;}

/* ---------- relation diagram (horizontal — boxes side by side, label above the line) ---------- */
.rel-diagram{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:0;}
.rel-end{flex:none;}
.rel-end-group{display:flex;align-items:center;flex:none;}
.rel-mid{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:170px;padding:0 18px;}
.rel-mult-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:24px;}
.rel-mult{font-weight:800;font-size:1rem;font-family:'JetBrains Mono';color:#B8790A;white-space:nowrap;}
.rel-role-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:20px;margin-top:2px;}
.rel-role{font-size:.9rem;font-style:italic;color:var(--dim);white-space:nowrap;}
.rel-label{display:block;color:var(--ink);background:transparent;margin-bottom:8px;font-size:1.08rem;font-weight:800;white-space:nowrap;text-align:center;}
.rel-line-row{display:flex;align-items:center;width:100%;}
.rel-line{flex:1;height:4px;border-radius:2px;background:var(--box-accent,var(--accent));min-width:90px;}
.rel-line.dashed{background:none;border-top:4px dashed var(--box-accent,var(--accent));height:0;}
.diamond{width:22px;height:22px;transform:rotate(45deg);flex:none;border:4px solid var(--box-accent,var(--accent));}
.diamond.hollow{background:#fff;}
.diamond.filled{background:var(--box-accent,var(--accent));}
.qualifier-box{border:2.5px solid var(--box-accent,var(--accent));border-left:none;background:#fff;padding:14px 14px;font-size:.85rem;font-family:'JetBrains Mono';font-weight:700;color:#B8790A;border-radius:0 8px 8px 0;text-align:center;align-self:stretch;display:flex;align-items:center;justify-content:center;white-space:nowrap;}

/* ---------- inheritance diagram ---------- */
.inherit-diagram{display:flex;flex-direction:column;align-items:center;padding:20px 0;}
.tri-hollow{width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:32px solid var(--box-accent,var(--accent));margin-top:2px;position:relative;}
.tri-hollow::after{content:'';position:absolute;left:-15px;top:7px;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:22px solid #fff;}
.vline{width:4px;height:30px;background:var(--box-accent,var(--accent));}
.children-row{display:flex;gap:44px;position:relative;padding-top:30px;flex-wrap:wrap;justify-content:center;row-gap:30px;}
.children-row::before{content:'';position:absolute;top:0;left:12%;right:12%;height:4px;background:var(--box-accent,var(--accent));}
.child-branch{display:flex;flex-direction:column;align-items:center;}
.stub{width:4px;height:30px;background:var(--box-accent,var(--accent));}

/* ---------- association class ---------- */
.assocclass-wrap{display:flex;flex-direction:column;align-items:center;}
.dash-line{width:0;border-left:4px dashed var(--box-accent,var(--accent));height:32px;}

/* ---------- self association ---------- */
.self-assoc{display:flex;align-items:center;gap:8px;}
.self-loop{margin-left:-4px;}
.self-labels{display:flex;flex-direction:column;justify-content:space-between;height:150px;padding:14px 0 14px 8px;font-size:.92rem;color:var(--dim);font-style:italic;}
.self-label-mid{color:#B8790A;font-style:normal;font-weight:700;font-family:'JetBrains Mono';font-size:.92rem;}

/* ---------- legend / cheatsheet ---------- */
.legend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:26px 0;}
.legend-item{background:#fff;border:1px solid rgba(42,27,77,.1);box-shadow:0 6px 16px rgba(42,27,77,.06);border-radius:14px;padding:16px 18px;}
.legend-sym{font-family:'JetBrains Mono';font-weight:800;color:var(--accent);font-size:1.1rem;}
.legend-txt{font-size:.95rem;color:var(--dim);margin-top:6px;}

/* ---------- cheatsheet slide ---------- */
.cheat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:12px;}
.cheat-card{background:#fff;border:2px solid rgba(42,27,77,.08);box-shadow:0 6px 16px rgba(42,27,77,.06);border-radius:18px;padding:22px 24px;}
.cheat-card .csym{font-size:2rem;margin-bottom:8px;}
.cheat-card h5{font-family:'Baloo 2';font-size:1.2rem;margin-bottom:7px;color:var(--ink);}
.cheat-card p{font-size:.95rem;color:var(--dim);margin:0;line-height:1.5;}

/* ---------- story / pillar flip cards ---------- */
.pillar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:22px;}
.flipcard{background:#fff;border:2px solid rgba(42,27,77,.1);box-shadow:0 6px 18px rgba(42,27,77,.07);border-radius:20px;padding:26px;cursor:pointer;transition:.25s;position:relative;}
.flipcard:hover{border-color:var(--flip-accent);transform:translateY(-4px);}
.flipcard .fc-emoji{font-size:2.4rem;}
.flipcard h4{margin:12px 0 8px;font-size:1.35rem;color:var(--ink);}
.flipcard p{font-size:1.02rem;line-height:1.5;color:var(--dim);margin:0;max-height:0;overflow:hidden;transition:max-height .3s ease;}
.flipcard.open p{max-height:220px;margin-top:10px;}
.flipcard .fc-hint{font-size:.82rem;color:var(--dim);opacity:.7;margin-top:10px;font-family:'JetBrains Mono';}

.compare-row{display:flex;gap:24px;flex-wrap:wrap;margin-top:22px;}
.compare-col{flex:1;min-width:300px;background:#fff;box-shadow:0 6px 18px rgba(42,27,77,.07);border-radius:18px;padding:24px 26px;border:2px solid rgba(42,27,77,.08);}
.compare-col h4{margin-bottom:12px;font-size:1.3rem;color:var(--ink);}
.compare-col.recipe{border-color:var(--pink);}
.compare-col.community{border-color:var(--cyan);}
.compare-col ul{margin:0;padding-left:20px;font-size:1.02rem;color:var(--dim);line-height:1.85;}

/* ---------- case study ---------- */
.case-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:24px;margin-top:12px;}
.case-card{background:#fff;border:2px solid rgba(42,27,77,.08);box-shadow:0 6px 18px rgba(42,27,77,.07);border-radius:20px;padding:24px;}
.case-card h5{font-family:'JetBrains Mono';font-size:.9rem;color:var(--accent);letter-spacing:.05em;margin-bottom:14px;text-transform:uppercase;}

/* ---------- outro ---------- */
.practice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px;}
.practice-card{background:#fff;border:2px solid rgba(42,27,77,.08);box-shadow:0 6px 18px rgba(42,27,77,.07);border-radius:18px;padding:22px;}
.practice-card .pnum{font-family:'Baloo 2';font-size:1.7rem;color:var(--accent);}
.refs{margin-top:32px;font-size:1rem;color:var(--dim);line-height:2;}
.credit{margin-top:44px;text-align:center;color:var(--dim);font-size:.98rem;}

/* ---------- package diagram ---------- */
.pkg-row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;justify-content:center;}
.pkg-box{position:relative;background:#fff;border:3px solid var(--box-accent,var(--accent));border-radius:0 14px 14px 14px;padding:18px 20px 20px;min-width:180px;text-align:left;margin-top:12px;color:var(--ink);box-shadow:0 6px 16px rgba(42,27,77,.08);}
.pkg-box::before{content:'';position:absolute;top:-12px;left:0;width:44px;height:12px;background:var(--box-accent,var(--accent));border-radius:5px 5px 0 0;}
.pkg-title{font-family:'Baloo 2';font-weight:800;font-size:1.1rem;text-align:center;margin-bottom:12px;}
.pkg-classes{display:flex;flex-direction:column;gap:7px;}
.pkg-class{background:rgba(42,27,77,.05);border:1.5px solid var(--box-accent,var(--accent));border-radius:7px;padding:6px 10px;font-family:'JetBrains Mono';font-weight:700;font-size:.85rem;color:var(--ink);text-align:center;}
.pkg-arrow{display:flex;flex-direction:column;align-items:center;font-size:.78rem;color:var(--dim);font-family:'JetBrains Mono';margin-top:60px;}
.pkg-arrow-line{width:54px;border-top:3px dashed var(--box-accent,var(--accent));position:relative;margin:6px 0;}
.pkg-arrow-line::after{content:'▸';position:absolute;right:-10px;top:-12px;font-size:1.1rem;color:var(--box-accent,var(--accent));}

@media (max-width:720px){
  html{font-size:16px;}
  .slide-inner{padding:110px 20px 80px;}
  #dotnav{display:none;}
  .navbtn{width:44px;height:44px;font-size:1.2rem;}
  #nextBtn{right:16px;}
  .example-card{padding:22px 20px 24px;}
}
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="blob blob4"></div>

<div id="storybar"></div>
<div id="topbar"><div id="brand">🧠 OOP: THE SERIES</div><div id="counter">1 / 15</div></div>
<div id="dotnav"></div>
<button class="navbtn" id="prevBtn">‹</button>
<button class="navbtn" id="nextBtn">›</button>

<div id="deck"></div>

<script>
/* ============================================================
   RENDER HELPERS — small functions that build UML-ish diagrams
   ============================================================ */
function uBox(name, attrs, ops, opts={}){
  const {abstract=false, stereotype=null, accent='var(--accent)', cls=''} = opts;
  const attrHTML = (attrs && attrs.length) ? attrs.map(a=>`<div>${a}</div>`).join('') : '<div class="dim">—</div>';
  let opsHTML = '';
  if(ops !== null){
    opsHTML = `<div class="uml-section uml-ops">${(ops && ops.length) ? ops.map(o=>`<div>${o}</div>`).join('') : '<div class="dim">—</div>'}</div>`;
  }
  return `<div class="uml-box ${abstract?'abstract':''} ${cls}" style="--box-accent:${accent}">
    ${stereotype?`<div class="uml-stereo">«${stereotype}»</div>`:''}
    <div class="uml-name">${name}</div>
    <div class="uml-section uml-attrs">${attrHTML}</div>
    ${opsHTML}
  </div>`;
}
function oBox(instance, cls, vals, accent='var(--accent)'){
  return `<div class="uml-box object-box" style="--box-accent:${accent}">
    <div class="uml-name">${instance} : ${cls}</div>
    <div class="uml-section">${vals.map(v=>`<div>${v}</div>`).join('')}</div>
  </div>`;
}
function twoBoxRel({left,right,label='',arrow=true,leftMult='',rightMult='',leftRole='',rightRole='',marker=null,diamondSide='left',accent='var(--accent)',dashed=false}){
  const isDia = marker==='agg' || marker==='comp';
  const dia = isDia ? `<div class="diamond ${marker==='comp'?'filled':'hollow'}" style="--box-accent:${accent}"></div>` : '';
  return `<div class="rel-diagram">
    <div class="rel-end">${left}</div>
    <div class="rel-mid" style="--box-accent:${accent}">
      <div class="rel-mult-row"><span class="rel-mult">${leftMult||''}</span><span class="rel-mult">${rightMult||''}</span></div>
      ${label?`<div class="rel-label">${label}${arrow?' ▸':''}</div>`:''}
      <div class="rel-line-row">
        ${diamondSide==='left'?dia:''}
        <div class="rel-line ${dashed?'dashed':''}"></div>
        ${diamondSide==='right'?dia:''}
      </div>
      ${(leftRole||rightRole)?`<div class="rel-role-row"><span class="rel-role">${leftRole||''}</span><span class="rel-role">${rightRole||''}</span></div>`:''}
    </div>
    <div class="rel-end">${right}</div>
  </div>`;
}
function inheritDiagram(parentHTML, childrenArr, accent='var(--accent)'){
  return `<div class="inherit-diagram" style="--box-accent:${accent}">
    <div class="parent-slot">${parentHTML}</div>
    <div class="tri-hollow"></div>
    <div class="vline"></div>
    <div class="children-row">
      ${childrenArr.map(c=>`<div class="child-branch"><div class="stub"></div>${c}</div>`).join('')}
    </div>
  </div>`;
}
function assocClassDiagram(relHTML, classHTML, accent='var(--accent)'){
  return `<div class="assocclass-wrap" style="--box-accent:${accent}">
    ${relHTML}
    <div class="dash-line"></div>
    <div class="assocclass-box">${classHTML}</div>
  </div>`;
}
function qualifierRel({left,right,qualifier,label='',leftMult='',rightMult='1',accent='var(--accent)'}){
  return `<div class="rel-diagram">
    <div class="rel-end-group">
      <div class="rel-end">${left}</div>
      <div class="qualifier-box" style="--box-accent:${accent}">🔑 ${qualifier}</div>
    </div>
    <div class="rel-mid" style="--box-accent:${accent}">
      <div class="rel-mult-row"><span class="rel-mult">${leftMult||''}</span><span class="rel-mult">${rightMult||''}</span></div>
      ${label?`<div class="rel-label">${label}</div>`:''}
      <div class="rel-line-row"><div class="rel-line"></div></div>
    </div>
    <div class="rel-end">${right}</div>
  </div>`;
}
function pkgBox(title, classes){
  return `<div class="pkg-box">
    <div class="pkg-title">📦 ${title}</div>
    <div class="pkg-classes">${classes.map(c=>`<div class="pkg-class">${c}</div>`).join('')}</div>
  </div>`;
}
function selfAssocDiagram(boxHTML, label, roleTop, roleBottom, accent='var(--accent)'){
  return `<div class="self-assoc" style="--box-accent:${accent}">
    <div class="self-box">${boxHTML}</div>
    <svg class="self-loop" viewBox="0 0 110 130" width="130" height="150">
      <defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="${accent}"></path></marker></defs>
      <path d="M8 22 C 95 8, 95 55, 12 60" fill="none" stroke="${accent}" stroke-width="4" marker-end="url(#arrowhead)"></path>
      <path d="M12 70 C 95 75, 95 118, 8 105" fill="none" stroke="${accent}" stroke-width="4"></path>
    </svg>
    <div class="self-labels">
      <div class="self-role top">${roleTop}</div>
      <div class="self-label-mid">${label}</div>
      <div class="self-role bottom">${roleBottom}</div>
    </div>
  </div>`;
}
function exampleCard({emoji,title,blurb,diagramHTML,syntax},i){
  return `<div class="example-card reveal" style="--i:${i}">
    <div class="example-head"><span class="example-emoji">${emoji}</span><h4>${title}</h4></div>
    <div class="example-diagram">${diagramHTML}</div>
    ${syntax?`<div class="syntax-chip"><code>${syntax}</code></div>`:''}
    <p class="example-blurb">${blurb}</p>
  </div>`;
}
function quizCard(item){
  return `<div class="quiz-card">
    <div class="quiz-q">${item.q}</div>
    <div class="quiz-options">
      ${item.options.map((opt,i)=>`<button class="quiz-opt" onclick="answerQuiz(this,${i},${item.correct})">${opt}</button>`).join('')}
    </div>
    <div class="quiz-explain"><div class="quiz-explain-inner">${item.explain}</div></div>
  </div>`;
}
function renderQuizSection(quiz){
  if(!quiz || !quiz.length) return '';
  return `<div class="quiz-section reveal">
    <h3 class="quiz-heading">🎯 Try It Yourself</h3>
    <p class="quiz-subheading">No peeking — pick an answer, then watch it spill the tea 👇</p>
    <div class="quiz-grid">${quiz.map(quizCard).join('')}</div>
  </div>`;
}
function answerQuiz(btn, chosen, correct){
  const card = btn.closest('.quiz-card');
  if(!card || card.classList.contains('answered')) return;
  card.classList.add('answered');
  const opts = card.querySelectorAll('.quiz-opt');
  opts.forEach((o,i)=>{
    if(i===correct) o.classList.add('correct');
    else if(i===chosen) o.classList.add('wrong');
  });
}
function problemCard(num, item){
  return `<div class="problem-card">
    <div class="problem-head"><div class="problem-num">${num}</div><div class="problem-title">${item.emoji} ${item.title}</div></div>
    <p class="problem-desc">${item.scenario}</p>
    <button class="problem-reveal-btn" onclick="revealSolution(this)">🔍 Reveal UML Solution</button>
    <div class="problem-solution"><div class="solution-diagrams">${item.blocks.map(b=>`<div class="solution-block"><div class="solution-block-label">${b.label}</div><div class="example-diagram">${b.html}</div></div>`).join('')}</div></div>
  </div>`;
}
function revealSolution(btn){
  const card = btn.closest('.problem-card');
  card.classList.toggle('revealed');
  btn.textContent = card.classList.contains('revealed') ? 'Hide Solution ▲' : '🔍 Reveal UML Solution';
}

/* ============================================================
   COLOR CYCLE
   ============================================================ */
const PALETTE = ['#0BB4C4','#F0338B','#F5A300','#4CAF3D','#8B5CF6'];

/* ============================================================
   SLIDE DATA
   ============================================================ */
const SLIDES = [];

/* ---------- 0: COVER ---------- */
SLIDES.push({id:'cover', accent:PALETTE[0], extraClass:'cover-slide', render: s => `
    <div class="slide-inner">
      <div class="eyebrow-pill reveal">UNIT 01 · OBJECT-ORIENTED PARADIGM & CLASS MODELING</div>
      <h1 class="cover-title reveal">Objects, Classes<br>& the whole squad 🧠✨</h1>
      <p class="cover-sub reveal">Every app you scroll — Instagram, Spotify, Swiggy — is secretly just a bunch of objects politely texting each other. This is the visual, click-through, zero-cap version of Unit 1. Every concept comes with 5 real examples, the actual UML syntax, and a diagram you can actually picture.</p>
      <div class="pillrow reveal">
        ${['Objects','Classes','Links','Associations','Multiplicity','Inheritance','Aggregation','Composition','Enums','Packages'].map(p=>`<div class="pill">${p}</div>`).join('')}
      </div>
      <button class="startbtn reveal" onclick="goTo(1)">Let's gooo →</button>
      <div class="coverfoot reveal">Professional Core Course · B.Tech II · AY 2025-26 · Prepared &amp; Taught by Prof. Bhumika · Sarvajanik University</div>
    </div>`});

/* ---------- 1: STORY OPEN — procedural vs OO + 4 pillars ---------- */
SLIDES.push({id:'story', accent:PALETTE[1], render: s => `
    <div class="slide-inner">
      <div class="kicker reveal">The Origin Story</div>
      <h2 class="slide-title reveal">Recipe vs. Group Project 🍳🤝</h2>
      <p class="slide-tagline reveal">Before objects, code was written like a recipe — data just sat there while functions poked at it from every direction. OO said "nah" and turned code into a group project where everyone owns their own part.</p>
      <div class="compare-row reveal">
        <div class="compare-col recipe">
          <h4>🍳 Procedural = a recipe</h4>
          <ul>
            <li>Data sits separately, functions poke it from outside</li>
            <li>Asks: "what steps do I run?"</li>
            <li>Any function can touch <code class="mono">balance</code> — no gatekeeper 😬</li>
            <li>Change impact ripples everywhere</li>
          </ul>
        </div>
        <div class="compare-col community">
          <h4>🤝 OO = a group project</h4>
          <ul>
            <li>Data + behavior bundled inside objects</li>
            <li>Asks: "which object should handle this?"</li>
            <li>Only <code class="mono">BankAccount</code> can touch its own <code class="mono">balance</code> 🔒</li>
            <li>Change stays inside one class</li>
          </ul>
        </div>
      </div>
      <div class="definition-box reveal" style="margin-top:24px;">This one question — <strong>"who's responsible?"</strong> — is the mindset for literally everything coming up. Keep asking it.</div>
      <h3 class="reveal" style="margin-top:36px;font-size:1.3rem;">The Four Pillars (tap to reveal) 👇</h3>
      <div class="pillar-grid reveal" id="pillarGrid"></div>
    </div>`,
  after: () => {
    const data = [
      {emoji:'🎯',accent:'#0BB4C4',title:'Abstraction',text:'Show only what matters, hide the rest. You drive with a wheel + pedals — not engine chemistry.'},
      {emoji:'🔒',accent:'#F0338B',title:'Encapsulation',text:'Bundle data + behavior, protect internals. You order pasta — you don\'t enter the kitchen.'},
      {emoji:'🧬',accent:'#4CAF3D',title:'Inheritance',text:'Reuse & specialize existing classes. SavingsAccount inherits balance + withdraw() from BankAccount for free.'},
      {emoji:'🎭',accent:'#F5A300',title:'Polymorphism',text:'One message, many object-specific reactions. makeSound() means something different for a Dog, Cat & Duck.'}
    ];
    const grid = document.getElementById('pillarGrid');
    if(grid) grid.innerHTML = data.map(d=>`<div class="flipcard" style="--flip-accent:${d.accent}" onclick="this.classList.toggle('open')">
      <div class="fc-emoji">${d.emoji}</div><h4>${d.title}</h4><p>${d.text}</p><div class="fc-hint">tap for the tea ☕</div>
    </div>`).join('');
  }});

/* ---------- 2: CLASSES & OBJECTS ---------- */
SLIDES.push({id:'class-object', accent:PALETTE[2], kicker:'Part 1 · The Vocabulary', title:'Classes & Objects 🏠',
  tagline:"A class is the blueprint. An object is the actual house built from it. One blueprint → unlimited houses, each with its own address (identity) and its own furniture (data).",
  definition:"A <strong>class</strong> defines the attributes + operations every object of that type will have. An <strong>object</strong> is one specific instance — it has its own unique identity, even if its data looks identical to another object.",
  syntaxLines:[
    'ClassName            → 3-part box: Name / Attributes / Operations',
    'attributeName: Type  → e.g. speed: Float',
    'operationName()      → e.g. accelerate()',
    'objectName : ClassName   → object box, name is <u>underlined</u>',
    'attribute = value    → filled-in value inside an object box'
  ],
  examples:[
    {emoji:'🚗',title:'Car (the OG example)',blurb:'A Car "knows" its own speed and fuel, and can accelerate itself. Attributes = what it knows, operations = what it can do.',
      diagramHTML: uBox('Car',['speed: Float','fuelLevel: Float','color: String'],['accelerate()','brake()','refuel()'],{accent:'var(--box-a)'}),
      syntax:'Car { speed, fuelLevel, color | accelerate(), brake(), refuel() }'},
    {emoji:'🎓',title:'Student → 2 real students',blurb:'One Student class, unlimited student objects. Anaya and Kabir have totally different values but come from the exact same blueprint.',
      diagramHTML: `<div style="display:flex;gap:20px;flex-wrap:nowrap;justify-content:center;overflow-x:auto;align-items:flex-start;">${uBox('Student',['name','rollNumber','cgpa'],['enroll()','submitAssignment()','calculateGPA()'])}${oBox('s1','Student',['name = Anaya','roll = 101','cgpa = 8.9'])}${oBox('s2','Student',['name = Kabir','roll = 102','cgpa = 7.6'])}</div>`,
      syntax:'s1: Student {name=Anaya, roll=101}  ≠  s2: Student {name=Kabir, roll=102}'},
    {emoji:'📸',title:'Instagram User class',blurb:'The app only models username, profilePhoto, followers — not your real height or blood type. Irrelevant details get left out on purpose.',
      diagramHTML: uBox('User',['username','profilePhoto','followers'],['follow()','post()']),
      syntax:'User { username, profilePhoto, followers | follow(), post() }'},
    {emoji:'🏦',title:'BankAccount — locked down',blurb:'balance is locked inside, reachable only through withdraw(). This is exactly why banking apps model each account as a protected object.',
      diagramHTML: uBox('BankAccount',['balance: Decimal'],['withdraw(amount)','deposit(amount)']),
      syntax:'class BankAccount { balance; withdraw(amount){ this.balance -= amount } }'},
    {emoji:'🎧',title:'Spotify Playlist',blurb:'name and songs are attributes. addSong() and shuffle() are operations — available on literally every playlist ever created, including yours.',
      diagramHTML: uBox('Playlist',['name: String','songs: List'],['addSong()','shuffle()']),
      syntax:'Playlist { name, songs | addSong(), shuffle() }'},
    {emoji:'🎮',title:'GameCharacter → 2 heroes',blurb:'Same GameCharacter class, two totally different heroes. health and level are attributes; attack() and heal() are things every character can DO, no matter which one.',
      diagramHTML: `<div style="display:flex;gap:20px;flex-wrap:nowrap;justify-content:center;overflow-x:auto;align-items:flex-start;">${uBox('GameCharacter',['health: Int','level: Int'],['attack()','heal()'])}${oBox('hero1','GameCharacter',['health = 100','level = 12'])}${oBox('hero2','GameCharacter',['health = 60','level = 7'])}</div>`,
      syntax:'hero1: GameCharacter {health=100, level=12}  ≠  hero2: GameCharacter {health=60, level=7}'},
    {emoji:'🌦️',title:'WeatherStation',blurb:'A WeatherStation object just sits there recording temperature and humidity — recordReading() is the one job it knows how to do, over and over.',
      diagramHTML: uBox('WeatherStation',['temperature: Float','humidity: Float'],['recordReading()']),
      syntax:'WeatherStation { temperature, humidity | recordReading() }'},
    {emoji:'📖',title:'LibraryBook → 2 copies',blurb:'Two copies of the same book title can be two different objects — one checked out, one still on the shelf. isCheckedOut tracks each copy\'s own status independently.',
      diagramHTML: `<div style="display:flex;gap:20px;flex-wrap:nowrap;justify-content:center;overflow-x:auto;align-items:flex-start;">${uBox('LibraryBook',['title','isbn','isCheckedOut'],['checkOut()','returnBook()'])}${oBox('b1','LibraryBook',['title = Dune','isCheckedOut = true'])}${oBox('b2','LibraryBook',['title = Dune','isCheckedOut = false'])}</div>`,
      syntax:'b1.isCheckedOut = true  ≠  b2.isCheckedOut = false  (same title, different objects)'}
  ],
  remember:"Two objects can have <em>identical</em> attribute values and still be completely different objects — like two students both named Rahul. Identity, not data, is what makes them distinct.",
  quiz:[
    {q:'Which one is the class, which is the object? "ChocolateChipCookie" the RECIPE vs the cookie sitting in your hand right now.',options:['Recipe = class, cookie = object','Recipe = object, cookie = class','Both are objects','Both are classes'],correct:0,
      explain:'🎯 Correct pick: A. The recipe is the blueprint (class) — every cookie baked from it is a separate object with its own crumbs and identity.'},
    {q:'Two Instagram accounts both named "@foodlover" — are they the same object?',options:['Yes, same username = same object','No — different identities even with identical-looking data','Only if they have the same follower count','Only if they post the same photo'],correct:1,
      explain:'🎯 Correct pick: B. Identity, not data, makes an object unique. Two accounts can look identical on paper and still be totally separate objects underneath.'},
    {q:'In a Car class, which of these is an OPERATION, not an attribute?',options:['color','accelerate()','fuelLevel','speed'],correct:1,
      explain:'🎯 Correct pick: B. Attributes are things a Car HAS (color, speed, fuel). accelerate() is something a Car DOES — that\'s always an operation, spot the parentheses!'},
    {q:'You just wrote "s1 = new Student()". What did you just create?',options:['A new class','A new object/instance of Student','A new attribute','A new operation'],correct:1,
      explain:'🎯 Correct pick: B. "new" always builds one specific instance from the blueprint — s1 is now a real object with its own identity, born from the Student class.'}
  ]
});

/* ---------- 3: LINKS & ASSOCIATIONS ---------- */
SLIDES.push({id:'association', accent:PALETTE[3], kicker:'Part 2 · No Object Is an Island', title:'Links & Associations 🔗',
  tagline:'A link is one concrete connection between two real objects ("Rahul enrolled in CS101"). An association is the class-level RULE that produces every one of those links.',
  definition:'Link : Object &nbsp;::&nbsp; Association : Class — same relationship, one level up. The most basic association is just a line between two boxes, with a label naming it. The ▸ arrow shows which way to <em>read</em> the label, not which way data flows.',
  syntaxLines:[
    'ClassA ────label▸──── ClassB     → association with reading direction',
    '"objA : ClassA — label — objB : ClassB"   → a concrete link (one real fact)'
  ],
  examples:[
    {emoji:'📚',title:'Student enrolls in Course',blurb:'The association is the rule. "rahul : Student — enrolls in — cs101 : Course" is one link — a single concrete fact produced by that rule.',
      diagramHTML: twoBoxRel({left:uBox('Student',null,null),right:uBox('Course',null,null),label:'enrolls in'}),
      syntax:'Student ────enrolls in▸──── Course'},
    {emoji:'🛒',title:'Customer places Order',blurb:'This is the starting point for literally every e-commerce diagram you will ever draw. Everything else (multiplicity, roles) attaches to this same simple line.',
      diagramHTML: twoBoxRel({left:uBox('Customer',null,null),right:uBox('Order',null,null),label:'places'}),
      syntax:'Customer ────places▸──── Order'},
    {emoji:'👔',title:'Employee manages Employee',blurb:'A class can link to itself! One Employee "manages" another Employee — this is called a self-association, and it needs role names to avoid total confusion.',
      diagramHTML: selfAssocDiagram(uBox('Employee',null,null),'manages ▸','manager','subordinate'),
      syntax:'Employee ────manages▸──── Employee  (self-association)'},
    {emoji:'🛂',title:'Person holds PassportCard',blurb:'Not every relationship is mandatory both ways — a Person might hold zero or one passport, but every PassportCard belongs to exactly one Person.',
      diagramHTML: twoBoxRel({left:uBox('Person',null,null),right:uBox('PassportCard',null,null),label:'holds'}),
      syntax:'Person ────holds▸──── PassportCard'},
    {emoji:'🛵',title:'Order delivered by DeliveryPartner',blurb:'The Swiggy/Zomato move — an Order needs to know who is bringing the food. This exact association gets an association class later (spoiler: grade-style extra data).',
      diagramHTML: twoBoxRel({left:uBox('Order',null,null),right:uBox('DeliveryPartner',null,null),label:'delivered by'}),
      syntax:'Order ────delivered by▸──── DeliveryPartner'},
    {emoji:'🎥',title:'Director directs Movie',blurb:'A Director directs many Movies over a career — a simple, clean association that every streaming app\'s "More from this director" feature relies on.',
      diagramHTML: twoBoxRel({left:uBox('Director',null,null),right:uBox('Movie',null,null),label:'directs'}),
      syntax:'Director ────directs▸──── Movie'},
    {emoji:'🏫',title:'Teacher teaches Course',blurb:'A Teacher teaches a Course — sounds obvious, but that obviousness is exactly the point. Most associations really are this simple once you strip away the notation.',
      diagramHTML: twoBoxRel({left:uBox('Teacher',null,null),right:uBox('Course',null,null),label:'teaches'}),
      syntax:'Teacher ────teaches▸──── Course'},
    {emoji:'🚌',title:'Passenger boards Bus',blurb:'A Passenger boards a Bus — everyday commuting, modeled. This exact association will get a multiplicity next slide (spoiler: buses have seat limits).',
      diagramHTML: twoBoxRel({left:uBox('Passenger',null,null),right:uBox('Bus',null,null),label:'boards'}),
      syntax:'Passenger ────boards▸──── Bus'}
  ],
  remember:"Every notation you'll see from here — multiplicity, roles, qualifiers — is just extra detail bolted onto this one simple line.",
  quiz:[
    {q:'"Customer places Order" — what is this relationship called?',options:['Inheritance','Association','Composition','Enumeration'],correct:1,
      explain:'🎯 Correct pick: B. A plain line connecting two classes, with a label naming the relationship — that\'s the textbook definition of an association.'},
    {q:'In "Customer ──places▸── Order", what does the ▸ arrow actually mean?',options:['Data flows only toward Order','It shows which way to READ the label — nothing more','Order can\'t exist without Customer','The multiplicity is 1'],correct:1,

/* ============================================================
   BUILD DOM
   ============================================================ */
const deck = document.getElementById('deck');
const dotnav = document.getElementById('dotnav');
const storybar = document.getElementById('storybar');
let current = 0;

SLIDES.forEach((s,i)=>{
  const wrap = document.createElement('div');
  wrap.className = 'slide' + (s.extraClass ? ' '+s.extraClass : '');
  wrap.id = 'slide-'+i;
  wrap.style.setProperty('--accent', s.accent);

  if(s.render){
    wrap.innerHTML = s.render(s);
  } else {
    let body = '';
    if(s.custom){
      body = s.custom();
    } else {
      body = `
      <div class="kicker reveal">${s.kicker||''}</div>
      <h2 class="slide-title reveal">${s.title||''}</h2>
      <p class="slide-tagline reveal">${s.tagline||''}</p>
      ${s.definition?`<div class="definition-box reveal">${s.definition}</div>`:''}
      ${s.syntaxLines?`<div class="syntax-block reveal"><div class="syntax-block-label">📝 Syntax you'll actually see</div>${s.syntaxLines.map(l=>`<code>${l}</code>`).join('')}</div>`:''}
      ${s.examples?`<div class="examples-grid">${s.examples.map((e,idx)=>exampleCard(e,idx)).join('')}</div>`:''}
      ${s.remember?`<div class="remember-box reveal">💡 <strong>Remember this:</strong> ${s.remember}</div>`:''}
      ${renderQuizSection(s.quiz)}
      `;
    }
    wrap.innerHTML = `<div class="slide-inner">${body}</div>`;
  }
  deck.appendChild(wrap);

  // dot nav
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.dataset.i = i;
  dot.innerHTML = `<span class="tip">${s.title || (s.id==='cover'?'Start':s.id==='story'?'The Big Idea':s.id==='outro'?'Thank You':s.id)}</span>`;
  dot.onclick = ()=>goTo(i);
  dotnav.appendChild(dot);

  // story bar
  const seg = document.createElement('div');
  seg.className='seg';
  seg.dataset.i = i;
  seg.innerHTML = `<div class="fill"></div>`;
  seg.onclick = ()=>goTo(i);
  storybar.appendChild(seg);
});

function goTo(i){
  if(i<0||i>=SLIDES.length) return;
  current = i;
  deck.style.transform = `translateX(-${i*100}vw)`;
  document.querySelectorAll('.slide').forEach((el,idx)=>{
    el.classList.toggle('active', idx===i);
    if(idx===i) el.scrollTop = 0;
  });
  document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('active', idx===i));
  document.querySelectorAll('.seg').forEach((seg,idx)=>{
    seg.classList.toggle('done', idx<i);
    seg.classList.toggle('current', idx===i);
  });
  document.getElementById('counter').textContent = `${i+1} / ${SLIDES.length}`;
  document.getElementById('prevBtn').disabled = i===0;
  document.getElementById('nextBtn').disabled = i===SLIDES.length-1;
  const sd = SLIDES[i];
  if(sd.after){ setTimeout(sd.after, 60); }
}

document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
let touchX=null;
document.body.addEventListener('touchstart', e=>{touchX=e.touches[0].clientX;});
document.body.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx)>60){ dx<0 ? goTo(current+1) : goTo(current-1); }
  touchX=null;
});

goTo(0);
</script>
